[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "supplement-barista"
version = "0.1.0"
requires-python = ">=3.10"
description = "Supplement Barista scheduling foundation"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[project.scripts]
supplement-barista = "supplement_barista.desktop:main"
